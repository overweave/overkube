apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels: { app.kubernetes.io/name: hello, app.kubernetes.io/instance: {{ .Release.Name }} }
data:
  message: {{ .Values.message | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: { app.kubernetes.io/name: hello, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.replicas }}
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: hello, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      containers:
        - name: hello
          image: {{ .Values.image }}
          command: [sh, -c, "echo $MESSAGE; sleep infinity"]
          env: [{ name: MESSAGE, valueFrom: { configMapKeyRef: { name: {{ .Release.Name }}, key: message } } }]
          resources: { requests: { cpu: 1m, memory: 4Mi }, limits: { memory: 16Mi } }
