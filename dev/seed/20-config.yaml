# Config, secrets and access: what the workloads read, the accounts they run
# as, who may do what in each namespace. Every value here is made up.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: seed-shop
  labels: { overkube.dev/seed: "true", app: web }
data:
  index.html: |
    <!doctype html>
    <title>seed shop</title>
    <h1>seed shop</h1>
    <p>Served by busybox httpd.</p>
  health: ok
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: seed-shop
  labels: { overkube.dev/seed: "true" }
data:
  LOG_LEVEL: info
  CACHE_TTL: "300"
  app.yaml: |
    server:
      port: 8080
      timeout: 30s
    db:
      host: db-0.db.seed-shop.svc.cluster.local
      pool: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags
  namespace: seed-ops
  labels: { overkube.dev/seed: "true" }
immutable: true
data:
  new-checkout: "false"
  dark-mode: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: seed-shop
  labels: { overkube.dev/seed: "true" }
type: Opaque
stringData:
  DB_PASSWORD: not-a-real-password
  API_KEY: seed-0000-0000
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: seed-shop
  labels: { overkube.dev/seed: "true" }
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: not-a-real-password
---
# A pull secret for a registry nothing here pulls from (registry.example.com): never used by docker.io pulls.
apiVersion: v1
kind: Secret
metadata:
  name: seed-pull
  namespace: seed-shop
  labels: { overkube.dev/seed: "true" }
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.example.com":{"username":"seed-bot","password":"not-a-real-token"}}}'
---
apiVersion: v1
kind: Secret
metadata:
  name: ops-token
  namespace: seed-ops
  labels: { overkube.dev/seed: "true" }
type: Opaque
stringData:
  token: not-a-real-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-app
  namespace: seed-shop
  labels: { overkube.dev/seed: "true" }
imagePullSecrets:
  - name: seed-pull
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-bot
  namespace: seed-ops
  labels: { overkube.dev/seed: "true" }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: seed-shop
  labels: { overkube.dev/seed: "true" }
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [app-config]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-app-reads-pods
  namespace: seed-shop
  labels: { overkube.dev/seed: "true" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-reader }
subjects:
  - { kind: ServiceAccount, name: shop-app, namespace: seed-shop }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-runner
  namespace: seed-ops
  labels: { overkube.dev/seed: "true" }
rules:
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-runs-jobs
  namespace: seed-ops
  labels: { overkube.dev/seed: "true" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: job-runner }
subjects:
  - { kind: ServiceAccount, name: ops-bot, namespace: seed-ops }
  - { kind: Group, apiGroup: rbac.authorization.k8s.io, name: seed-ops-team }
---
# A namespace's binding of a cluster role: the seed's aggregated viewer, in shop only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devs-view-shop
  namespace: seed-shop
  labels: { overkube.dev/seed: "true" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: seed-viewer }
subjects:
  - { kind: User, apiGroup: rbac.authorization.k8s.io, name: bob@seed.test }
