# What the metrics addon reads: metrics-server (now: CPU, memory — what kubectl top says; the
# metrics.k8s.io API) and VictoriaMetrics single (over time: the kubelets' cAdvisor and resource
# metrics, scraped through the API server's node proxy, kept 7 days) in seed-monitoring. metrics-server
# asks the kubelets themselves: their certificate is KubeSolo's own, not checked (--kubelet-insecure-tls).
apiVersion: v1
kind: Namespace
metadata:
  name: seed-monitoring
  labels:
    overkube.dev/seed: "true"
    pod-security.kubernetes.io/enforce: baseline
---
# ── metrics-server ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-server
  namespace: seed-monitoring
  labels: { overkube.dev/seed: "true" }
---
# Who may read the metrics: those who may view (edit, admin) — the metrics.k8s.io kinds aggregated into them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: seed-metrics-reader
  labels:
    overkube.dev/seed: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: seed-metrics-server
  labels: { overkube.dev/seed: "true" }
rules:
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: seed-metrics-server
  labels: { overkube.dev/seed: "true" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: seed-metrics-server }
subjects: [{ kind: ServiceAccount, name: metrics-server, namespace: seed-monitoring }]
---
# An aggregated API server: it asks the API server who a request is (delegated), reading how (kube-system's config).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: seed-metrics-server-auth-delegator
  labels: { overkube.dev/seed: "true" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator }
subjects: [{ kind: ServiceAccount, name: metrics-server, namespace: seed-monitoring }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-metrics-server-auth-reader
  namespace: kube-system
  labels: { overkube.dev/seed: "true" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: extension-apiserver-authentication-reader }
subjects: [{ kind: ServiceAccount, name: metrics-server, namespace: seed-monitoring }]
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-server
  namespace: seed-monitoring
  labels: { overkube.dev/seed: "true", app: metrics-server }
spec:
  selector: { app: metrics-server }
  ports: [{ name: https, port: 443, targetPort: https }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: seed-monitoring
  labels: { overkube.dev/seed: "true", app: metrics-server }
spec:
  selector: { matchLabels: { app: metrics-server } }
  template:
    metadata:
      labels: { overkube.dev/seed: "true", app: metrics-server }
    spec:
      serviceAccountName: metrics-server
      containers:
        - name: metrics-server
          image: registry.k8s.io/metrics-server/metrics-server:v0.9.0
          args:
            - --cert-dir=/tmp
            - --secure-port=10250
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            - --kubelet-use-node-status-port
            - --metric-resolution=15s
            - --kubelet-insecure-tls
          ports: [{ name: https, containerPort: 10250 }]
          readinessProbe: { httpGet: { path: /readyz, port: https, scheme: HTTPS }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /livez, port: https, scheme: HTTPS }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 200Mi } }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
  labels: { overkube.dev/seed: "true" }
spec:
  service: { name: metrics-server, namespace: seed-monitoring }
  group: metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
---
# ── VictoriaMetrics single ──────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmsingle
  namespace: seed-monitoring
  labels: { overkube.dev/seed: "true" }
---
# Its scrapes: the nodes found, each kubelet's metrics read through the API server's proxy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: seed-vmsingle
  labels: { overkube.dev/seed: "true" }
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: seed-vmsingle
  labels: { overkube.dev/seed: "true" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: seed-vmsingle }
subjects: [{ kind: ServiceAccount, name: vmsingle, namespace: seed-monitoring }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmsingle-scrape
  namespace: seed-monitoring
  labels: { overkube.dev/seed: "true" }
data:
  scrape.yaml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # Containers: CPU, memory, network, throttling (container_* series).
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config: { ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - { target_label: __address__, replacement: kubernetes.default.svc:443 }
          - { source_labels: [__meta_kubernetes_node_name], target_label: __metrics_path__, replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor }
          - { source_labels: [__meta_kubernetes_node_name], target_label: node }
      # Pods, containers and nodes as the kubelet sums them (what metrics-server reads too).
      - job_name: kubelet-resource
        scheme: https
        tls_config: { ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - { target_label: __address__, replacement: kubernetes.default.svc:443 }
          - { source_labels: [__meta_kubernetes_node_name], target_label: __metrics_path__, replacement: /api/v1/nodes/$1/proxy/metrics/resource }
          - { source_labels: [__meta_kubernetes_node_name], target_label: node }
---
apiVersion: v1
kind: Service
metadata:
  name: vmsingle-main
  namespace: seed-monitoring
  labels: { overkube.dev/seed: "true", app: vmsingle }
spec:
  selector: { app: vmsingle }
  ports: [{ name: http, port: 8428, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmsingle
  namespace: seed-monitoring
  labels: { overkube.dev/seed: "true", app: vmsingle }
spec:
  selector: { matchLabels: { app: vmsingle } }
  template:
    metadata:
      labels: { overkube.dev/seed: "true", app: vmsingle }
    spec:
      serviceAccountName: vmsingle
      containers:
        - name: vmsingle
          image: victoriametrics/victoria-metrics:v1.154.0
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=7d
            - -httpListenAddr=:8428
            - -promscrape.config=/config/scrape.yaml
          ports: [{ name: http, containerPort: 8428 }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: storage, mountPath: /storage }
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - { name: storage, emptyDir: {} }
        - { name: config, configMap: { name: vmsingle-scrape } }
