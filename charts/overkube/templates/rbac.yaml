{{- if eq .Values.auth.mode "oidc" }}
# Signed in with OpenID Connect, one is impersonated: the server's ServiceAccount may impersonate users and
# groups — whoever runs as it may act as anyone (the server never as system:* names).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "overkube.name" . }}-impersonate
  labels:
    {{- include "overkube.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [users, groups]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "overkube.name" . }}-impersonate
  labels:
    {{- include "overkube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "overkube.name" . }}-impersonate
subjects:
  - kind: ServiceAccount
    name: {{ include "overkube.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
