apiVersion: v1
kind: Service
metadata:
  name: {{ include "overkube.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "overkube.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "overkube.selector" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
